<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Model Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>

  <!-- Change 'your-new-filename.glb' to your exact new file name -->
  <model-viewer 
    src="your-new-filename.glb" 
    alt="3D Model" 
    auto-rotate 
    camera-controls 
    style="width: 100%; height: 500px;">
  </model-viewer>

</body>
</html>
